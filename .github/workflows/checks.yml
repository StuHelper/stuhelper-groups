name: Groups checks
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Groups checks
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@v7.0.1
        with:
          repository: StuHelper/stuhelper-platform
          ref: 0efdba00ff59cddc9d7894092aace9b9212696f0
          path: .tools/candidates/platform
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: StuHelper/stuhelper-verification
          ref: d9045908aa41dafe256865ed222ff2bca5d03804
          path: .tools/candidates/verification
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: StuHelper/stuhelper-qq-binding
          ref: 47f1d06881aff22ae06cc86ef86f4241db232fa9
          path: .tools/candidates/qq-binding
          persist-credentials: false
      - name: Record candidate sources
        run: |
          cat candidate-sources.json >> "$GITHUB_STEP_SUMMARY"
          printf 'groups: %s\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: StuHelper/stuhelper-tooling/actions/setup@v0.1.0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Install locked dependencies and PostgreSQL
        run: |
          pnpm install --frozen-lockfile
          sudo apt-get update -qq
          sudo apt-get install -y postgresql postgresql-client
      - name: Check isolated module
        run: bash scripts/check-with-postgres.sh
